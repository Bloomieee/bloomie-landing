<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - Bloomie</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles/styles.css" />
</head>
<body>
  <div class="profile-edit-container">
    <!-- Header -->
    <div class="profile-edit-header">
      <button class="back-btn" onclick="window.history.back()">
        <i class="fas fa-arrow-left"></i>
      </button>
      <h1 class="profile-edit-title">Edit profile</h1>
      <div class="header-spacer"></div>
    </div>
    
    <!-- Avatar Section -->
    <div class="edit-avatar-section">
      <div class="edit-avatar">
        <i class="fas fa-user"></i>
      </div>
      <button class="change-photo-btn">
        <i class="fas fa-camera"></i>
        Change photo
      </button>
    </div>
    
    <!-- Edit Form -->
    <form id="profileEditForm" class="profile-edit-form">
      <div class="form-group">
        <label class="form-label">Full name *</label>
        <input type="text" name="fullName" class="form-input" id="editName" placeholder="Enter your name" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Email *</label>
        <input type="email" name="email" class="form-input" id="editEmail" placeholder="Enter your email" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Phone *</label>
        <input type="tel" name="phone" class="form-input" id="editPhone" placeholder="+52 55 1234 5678" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Date of birth</label>
        <input type="date" name="birthdate" class="form-input" id="editBirthdate">
      </div>
      
      <div class="form-group">
        <label class="form-label">Skin type</label>
        <select name="skinType" class="form-input form-select" id="editSkinType">
          <option value="">Select skin type...</option>
          <option value="normal">Normal</option>
          <option value="dry">Dry</option>
          <option value="oily">Oily</option>
          <option value="combination">Combination</option>
          <option value="sensitive">Sensitive</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="form-label">Address</label>
        <input type="text" name="address" class="form-input" id="editAddress" placeholder="City, Country">
      </div>
      
      <div class="form-actions">
        <button type="button" class="btn-cancel" onclick="window.history.back()">Cancel</button>
        <button type="submit" class="btn-save">Save changes</button>
      </div>
    </form>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="consult.html" class="nav-item">
        <i class="fas fa-comment-alt"></i>
        <span>Consult</span>
      </a>
      <a href="rutina.html" class="nav-item">
        <i class="fas fa-hand-holding-water"></i>
        <span>Skin care</span>
      </a>
      <a href="profile.html" class="nav-item active">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>
  </div>
  
  <script src="assets/scripts/profile-edit.js"></script>
</body>
</html>
